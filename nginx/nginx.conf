events {
    worker_connections 1024;
}

http {
    # ── HTTP ──────────────────────────────────────────────────────────────────
    # Serves ACME challenge for Let's Encrypt, then redirects everything to HTTPS.
    server {
        listen 80;
        server_name finnbot.duckdns.org;

        # Let's Encrypt HTTP-01 challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all HTTP → HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS ─────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name finnbot.duckdns.org;

        ssl_certificate     /etc/letsencrypt/live/finnbot.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/finnbot.duckdns.org/privkey.pem;

        # Modern TLS only
        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options            DENY                                  always;
        add_header X-Content-Type-Options     nosniff                               always;

        # ── dashboard (static HTML) ──────────────────────────────────────────
        location /dashboard/ {
            alias /usr/share/nginx/html/dashboard/;
            try_files $uri /dashboard/index.html;
            add_header Cache-Control "no-cache";
        }

        # ── finbot-api ────────────────────────────────────────────────────────
        # trading-agents is internal only — called by finbot-api, not exposed here
        location / {
            proxy_pass         http://finbot-api:3000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
