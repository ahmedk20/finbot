// ─── API ─────────────────────────────────────────────────────────────────────
const API = '/api/v1';  // same-origin via nginx

async function apiFetch(path, opts = {}) {
  const res = await fetch(`${API}${path}`, {
    credentials: 'include',
    headers: { 'Content-Type': 'application/json', ...opts.headers },
    ...opts,
  });
  if (res.status === 401) throw Object.assign(new Error('Unauthorized'), { status: 401 });
  const json = await res.json();
  if (!json.success) throw new Error(json.error?.message || 'API error');
  return json.data;
}

function fmtPrice(n) {
  if (n == null) return '—';
  return n >= 1000 ? `$${Number(n).toLocaleString()}` : `$${Number(n).toFixed(2)}`;
}

// Very simple markdown → HTML renderer
const isArabic = (text) => text && /[\u0600-\u06FF]/.test(text);

function renderMd(md) {
  if (!md) return null;
  const lines = md.split('\n');
  const out = [];
  let tableRows = [];
  let inTable = false;
  let ulItems = [];

  const flush = () => {
    if (inTable && tableRows.length) {
      out.push(
        <table key={`t${out.length}`}>
          <tbody>{tableRows.map((r,i)=><tr key={i}>{r.map((c,j)=>i===0?<th key={j}>{c}</th>:<td key={j}>{c}</td>)}</tr>)}</tbody>
        </table>
      );
      tableRows = []; inTable = false;
    }
    if (ulItems.length) {
      out.push(<ul key={`ul${out.length}`}>{ulItems.map((x,i)=><li key={i}>{x}</li>)}</ul>);
      ulItems = [];
    }
  };

  lines.forEach((line, i) => {
    if (line.startsWith('### ')) { flush(); out.push(<h3 key={i}>{line.slice(4)}</h3>); return; }
    if (line.startsWith('## '))  { flush(); out.push(<h2 key={i}>{line.slice(3)}</h2>); return; }
    if (line.startsWith('# '))   { flush(); out.push(<h1 key={i}>{line.slice(2)}</h1>); return; }
    if (line.startsWith('> '))   { flush(); out.push(<blockquote key={i}>{line.slice(2)}</blockquote>); return; }
    if (line.startsWith('- ') || line.startsWith('* ')) {
      if (inTable) flush();
      ulItems.push(line.slice(2));
      return;
    }
    if (line.startsWith('|')) {
      if (ulItems.length) flush();
      inTable = true;
      const cells = line.split('|').slice(1,-1).map(c=>c.trim());
      if (!cells.every(c=>/^[-: ]+$/.test(c))) tableRows.push(cells);
      return;
    }
    flush();
    if (!line.trim()) { out.push(<br key={i}/>); return; }
    // inline: **bold**, *italic*, `code`
    const parts = line.split(/(\*\*[^*]+\*\*|\*[^*]+\*|`[^`]+`)/g).map((p, j) => {
      if (p.startsWith('**') && p.endsWith('**')) return <strong key={j}>{p.slice(2,-2)}</strong>;
      if (p.startsWith('*')  && p.endsWith('*'))  return <em key={j}>{p.slice(1,-1)}</em>;
      if (p.startsWith('`')  && p.endsWith('`'))  return <code key={j}>{p.slice(1,-1)}</code>;
      return p;
    });
    out.push(<p key={i}>{parts}</p>);
  });
  flush();
  return out;
}

function JobStatusBar({ status, jobId, error }) {
  if (!status) return null;
  const c = {waiting:'#6b8cff',active:'#f5c842',completed:'#4dff91',failed:'#ff4d4d'}[status] || '#6b8cff';
  const msgs = {waiting:'Job queued — waiting for worker…',active:'Analysis running — fetching data, calling LLMs…',completed:'Analysis complete.',failed:'Job failed.'};
  return (
    <div style={{background:'#0a0e14',border:`1px solid ${c}22`,borderRadius:'4px',padding:'10px 16px',marginBottom:'20px',display:'flex',alignItems:'center',gap:'12px'}}>
      {(status==='active'||status==='waiting') ? (
        <div className="spinner" style={{'--sc':c}}/>
      ) : (
        <div style={{width:'6px',height:'6px',borderRadius:'50%',background:c}}/>
      )}
      <div>
        <div style={{fontSize:'12px',color:'#8090a0'}}>{msgs[status]}{error ? ` ${error}` : ''}</div>
        {jobId && <div style={{fontSize:'10px',color:'#2a3d50',marginTop:'2px'}}>job: {jobId}</div>}
      </div>
      <div style={{marginLeft:'auto',fontSize:'10px',letterSpacing:'0.08em',color:c,textTransform:'uppercase'}}>{status}</div>
    </div>
  );
}

          <div style={{fontSize:'10px',color:`${dc}99`,letterSpacing:'0.15em',textTransform:'uppercase',marginBottom:'4px'}}>RECOMMENDATION</div>
          <div style={{fontFamily:"'Syne',sans-serif",fontSize:'32px',fontWeight:'800',color:dc,letterSpacing:'2px'}}>{d.decision}</div>
          <div style={{fontSize:'11px',color:`${dc}55`,marginTop:'3px'}}>
            {d.decision==='BUY'?'Entry confirmed':d.decision==='SELL'?'Reduce / Exit':'Wait for catalyst'}
          </div>
        </div>
      </div>

      {/* Meta bar */}
      <div style={{display:'flex',gap:'24px',marginBottom:'24px',flexWrap:'wrap'}}>
        {(d.metaBar||[{label:'Date',value:d.date},{label:'Job ID',value:d.jobId},{label:'Asset Type',value:d.assetType}]).map((m,i)=>(
          <div key={i} style={{fontSize:'11px'}}>
            <span style={{color:'#1e2d3d',marginRight:'6px'}}>{m.label}:</span>
            <span style={{color:'#4a6070'}}>{m.value}</span>
          </div>
        ))}
      </div>

      {/* Two-col grid — only in demo/mock mode OR when indicators available */}
      {!isLive && d.indicators && (
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'14px',marginBottom:'14px'}}>
          {/* Indicators */}
          <div style={{background:'#0d1117',border:'1px solid #1a2030',borderRadius:'6px',overflow:'hidden'}}>
            <div style={{padding:'12px 16px',borderBottom:'1px solid #111820',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <span style={{fontSize:'10px',letterSpacing:'0.12em',textTransform:'uppercase',color:'#3a4d60'}}>Technical Indicators</span>
              <span style={{fontSize:'10px',color:d.indicators.filter(x=>x.signal==='bearish').length>4?'#ff4d4d':'#4dff91',letterSpacing:'0.08em'}}>{d.indicatorSummary}</span>
            </div>
            {d.indicators.map((ind,i)=>{
              const s=signalStyle[ind.signal];
              return (
                <div key={i} className="ind-row">
                  <span style={{fontSize:'11px',color:'#3a5060'}}>{ind.label}</span>
                  <span style={{fontSize:'12px',color:'#b0bac8',fontWeight:'500'}}>{ind.value}</span>
                  <span className="signal-badge" style={{background:s.bg,color:s.color}}>
                    <span style={{width:'5px',height:'5px',borderRadius:'50%',background:s.dot,display:'inline-block',flexShrink:0}}/>
                    {ind.note}
                  </span>
                </div>
              );
            })}
          </div>
          {/* Fundamentals grid */}
          <div style={{background:'#0d1117',border:'1px solid #1a2030',borderRadius:'6px',overflow:'hidden'}}>
            <div style={{padding:'12px 16px',borderBottom:'1px solid #111820'}}>
              <span style={{fontSize:'10px',letterSpacing:'0.12em',textTransform:'uppercase',color:'#3a4d60'}}>Fundamental Metrics</span>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'1px',background:'#0e1520'}}>
              {d.fundamentals.map((f,i)=>(
                <div key={i} className="metric-cell">
                  <div style={{fontSize:'9px',color:'#1e3040',letterSpacing:'0.1em',textTransform:'uppercase',marginBottom:'5px'}}>{f.label}</div>
                  <div style={{fontSize:'13px',color:'#c0cad5',fontWeight:'500'}}>{f.value}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* Revenue bars — mock only */}
      {!isLive && d.revBars && (
        <div style={{background:'#0d1117',border:'1px solid #1a2030',borderRadius:'6px',padding:'16px 20px',marginBottom:'14px'}}>
          <div style={{fontSize:'10px',letterSpacing:'0.12em',textTransform:'uppercase',color:'#3a4d60',marginBottom:'14px'}}>{d.revLabel}</div>
          <div style={{display:'flex',alignItems:'flex-end',gap:'12px',height:'68px'}}>
            {d.revBars.map((q,i)=>{
              const h=Math.round((q.val/maxRevVal)*56);
              return (
                <div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:'4px'}}>
                  <div style={{fontSize:'10px',color:'#4dff91',height:'14px',display:'flex',alignItems:'center'}}>{q.growth||''}</div>
                  <div style={{width:'100%',position:'relative',height:`${h}px`,background:`rgba(77,255,145,${0.1+i*0.07})`,border:'1px solid rgba(77,255,145,0.18)',borderRadius:'2px 2px 0 0'}}>
                    <div style={{position:'absolute',top:'-16px',left:'50%',transform:'translateX(-50%)',fontSize:'9px',color:'#3a5040',whiteSpace:'nowrap'}}>{q.val}B</div>
                  </div>
                  <div style={{fontSize:'10px',color:'#1e3040'}}>{q.q}</div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* Risk matrix — mock only */}
      {!isLive && d.riskMatrix && (
        <div style={{background:'#0d1117',border:'1px solid #1a2030',borderRadius:'6px',padding:'16px 20px',marginBottom:'14px'}}>
          <div style={{fontSize:'10px',letterSpacing:'0.12em',textTransform:'uppercase',color:'#3a4d60',marginBottom:'14px'}}>Risk / Catalyst Matrix</div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'8px'}}>
            {d.riskMatrix.map((r,i)=>{
              const p=r.sentiment==='pos';
              return (
                <div key={i} className="risk-card" style={{background:p?'rgba(77,255,145,0.04)':'rgba(255,77,77,0.04)',border:`1px solid ${p?'rgba(77,255,145,0.1)':'rgba(255,77,77,0.1)'}`}}>
                  <div style={{fontSize:'13px',marginBottom:'4px'}}>{r.icon}</div>
                  <div style={{fontSize:'10px',color:'#3a5060',lineHeight:1.4,marginBottom:'4px'}}>{r.factor}</div>
                  <div style={{fontSize:'9px',letterSpacing:'0.06em',color:p?'#3d8860':'#885050'}}>{r.impact} IMPACT</div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* Tabs */}
      <div style={{background:'#0d1117',border:'1px solid #1a2030',borderRadius:'6px',overflow:'hidden'}}>
        <div style={{display:'flex',borderBottom:'1px solid #111820',overflowX:'auto'}}>
          {tabDefs.map(t=>(
            <button key={t.id} className={`tab-btn ${tab===t.id?'active':''}`} onClick={()=>setTab(t.id)}>{t.label}</button>
          ))}
        </div>
        <div style={{padding:'22px 24px',minHeight:'280px'}}>

          {/* Trade plan (structured) */}
          {tab==='plan' && (
            <div style={{display:'flex',flexDirection:'column',gap:'14px'}}>
              <div style={{fontSize:'10px',letterSpacing:'0.12em',color:'#3a4d60',textTransform:'uppercase',marginBottom:'8px'}}>Action Plan</div>
              {planItems.length > 0 ? planItems.map((p,i)=>(
                <div key={i} style={{display:'flex',gap:'16px',alignItems:'flex-start'}}>
                  <span style={{fontFamily:"'Syne',sans-serif",fontSize:'22px',fontWeight:'800',color:'#1a2535',lineHeight:1,flexShrink:0,width:'32px'}}>{p.step}</span>
                  <div>
                    <div style={{fontSize:'11px',color:dc,letterSpacing:'0.08em',marginBottom:'3px',textTransform:'uppercase'}}>{p.action}</div>
                    <div style={{fontSize:'13px',color:'#4a6070',lineHeight:1.65}}>{p.detail}</div>
                  </div>
                </div>
              )) : (
                <div className="prose">{renderMd(tabContent.fundamentals) || <span className="report-empty">No investment plan data available.</span>}</div>
              )}
            </div>
          )}

          {/* Final Decision — special header */}
          {tab==='reasoning' && tabContent.reasoning && (
            <div>
              <div style={{display:'flex',alignItems:'center',gap:'10px',marginBottom:'18px'}}>
                <div style={{width:'3px',height:'32px',background:dc,borderRadius:'2px'}}/>
                <div>
                  <div style={{fontFamily:"'Syne',sans-serif",fontSize:'15px',fontWeight:'700',color:'#e2e8f0'}}>
                    Final Verdict: {d.decision}{d.decision==='BUY'?' / Enter Long':d.decision==='SELL'?' / Reduce Position':' / Hold & Monitor'}
                  </div>
                  <div style={{fontSize:'11px',color:'#3a4d60'}}>Multi-factor AI analysis · {d.date}</div>
                </div>
              </div>
              <div className={`prose${isArabic(tabContent.reasoning)?' rtl':''}`}>{renderMd(tabContent.reasoning)}</div>
            </div>
          )}

          {/* All other text tabs */}
          {tab!=='reasoning' && tab!=='plan' && (
            <div className={`prose${isArabic(tabContent[tab])?' rtl':''}`}>
              {tabContent[tab]
                ? renderMd(tabContent[tab])
                : <span className="report-empty">No data available for this report.</span>
              }
            </div>
          )}
        </div>
      </div>

      {/* Footer */}
      <div style={{marginTop:'16px',display:'flex',justifyContent:'space-between',flexWrap:'wrap',gap:'8px'}}>
        <span style={{fontSize:'10px',color:'#131e2a'}}>FinBot Multi-Agent Analysis Engine · Job: {d.jobId||`analysis:${d.asset}:${d.date}`} · Generated {d.date}</span>
        <span style={{fontSize:'10px',color:'#131e2a'}}>⚠ Not financial advice. For informational purposes only.</span>
      </div>
    </div>
  );
}

function EmptyState({ onLoad }) {
  return (
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'60px 24px',textAlign:'center'}}>
      <div style={{fontFamily:"'Syne',sans-serif",fontSize:'28px',fontWeight:'800',color:'#0e1828',marginBottom:'12px'}}>NO ANALYSIS</div>
      <div style={{fontSize:'12px',color:'#1a2d40',maxWidth:'320px',lineHeight:1.7,marginBottom:'24px'}}>Enter a ticker in the nav bar and hit Run Analysis, or load the latest result for an asset.</div>
      <div style={{display:'flex',gap:'8px'}}>
        {Object.keys(MOCK).map(a=>(
          <button key={a} className="nav-btn" onClick={()=>onLoad(a)}>{a}</button>
        ))}
      </div>
    </div>
  );
}

function LoginScreen({ onLogin }) {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    setError(''); setLoading(true);
    try {
      await login(email, password);
      onLogin();
    } catch (err) {
      setError(err.message || 'Login failed');
    } finally {
      setLoading(false);
    }
  };

  return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:'24px'}}>
      <div style={{fontFamily:"'Syne',sans-serif",fontSize:'22px',fontWeight:'800',color:'#fff',letterSpacing:'0.1em'}}>FINBOT</div>
      <form onSubmit={submit} className="login-card">
        <div style={{marginBottom:'24px'}}>
          <div style={{fontFamily:"'Syne',sans-serif",fontSize:'16px',fontWeight:'700',color:'#e2e8f0',marginBottom:'4px'}}>Sign In</div>
          <div style={{fontSize:'11px',color:'#2a3d50'}}>Multi-Agent Analysis Dashboard</div>
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:'12px'}}>
          <div>
            <div style={{fontSize:'10px',color:'#2a3d50',letterSpacing:'0.1em',textTransform:'uppercase',marginBottom:'6px'}}>Email</div>
            <input className="login-input" type="email" placeholder="you@example.com" value={email} onChange={e=>setEmail(e.target.value)} required />
          </div>
          <div>
            <div style={{fontSize:'10px',color:'#2a3d50',letterSpacing:'0.1em',textTransform:'uppercase',marginBottom:'6px'}}>Password</div>
            <input className="login-input" type="password" placeholder="••••••••" value={password} onChange={e=>setPassword(e.target.value)} required />
          </div>
          {error && <div style={{fontSize:'11px',color:'#ff4d4d',background:'rgba(255,77,77,0.08)',border:'1px solid rgba(255,77,77,0.2)',borderRadius:'3px',padding:'8px 12px'}}>{error}</div>}
          <button className="login-btn" type="submit" disabled={loading}>{loading ? 'Signing in…' : 'Sign In'}</button>
        </div>
        <div style={{marginTop:'16px',textAlign:'center',fontSize:'10px',color:'#1a2535'}}>API: localhost:3000</div>
      </form>
    </div>
  );
}

// ─── App ─────────────────────────────────────────────────────────────────────
function App() {
  const [authed,    setAuthed]    = useState(false);
  const [authCheck, setAuthCheck] = useState(true); // waiting for initial token refresh

  const [assetInput, setAssetInput] = useState('BTC');
  const [dateInput,  setDateInput]  = useState(new Date().toISOString().split('T')[0]);
  const [result,     setResult]     = useState(null);
  const [isLive,     setIsLive]     = useState(false);

  const [jobStatus,  setJobStatus]  = useState(null);
  const [jobId,      setJobId]      = useState(null);
  const [jobError,   setJobError]   = useState(null);
  const [running,    setRunning]    = useState(false);

  const pollRef = useRef(null);

  // Try to restore session silently on mount
  useEffect(() => {
    refresh()
      .then(() => setAuthed(true))
      .catch(() => {})
      .finally(() => setAuthCheck(false));
  }, []);

  const stopPoll = () => { if (pollRef.current) { clearInterval(pollRef.current); pollRef.current = null; } };

  const startPolling = useCallback((jid) => {
    stopPoll();
    pollRef.current = setInterval(async () => {
      try {
        const data = await pollJob(jid);
        setJobStatus(data.status);
        if (data.status === 'completed') {
          stopPoll();
          setRunning(false);
          if (data.result) {
            setResult(data.result);
            setIsLive(true);
          }
          setTimeout(() => setJobStatus(null), 2000);
        } else if (data.status === 'failed') {
          stopPoll();
          setRunning(false);
          setJobError(data.error || 'Job failed');
        }
      } catch (err) {
        if (err.status === 401) { stopPoll(); setAuthed(false); }
      }
    }, 2000);
  }, []);

  const runAnalysis = async () => {
    const asset = assetInput.trim().toUpperCase();
    if (!asset || running) return;
    setRunning(true);
    setJobError(null);
    setJobStatus('waiting');
    setResult(null);
    try {
      const { jobId: jid } = await submitAnalysis(asset, dateInput);
      setJobId(jid);
      startPolling(jid);
    } catch (err) {
      if (err.status === 401) { setAuthed(false); return; }
      setJobError(err.message);
      setJobStatus('failed');
      setRunning(false);
    }
  };

  const loadLatest = async (asset) => {
    setAssetInput(asset);
    setJobStatus(null);
    try {
      const data = await fetchLatest(asset);
      setResult(data);
      setIsLive(true);
    } catch (err) {
      if (err.status === 401) { setAuthed(false); return; }
      // Fallback to mock
      if (MOCK[asset]) { setResult(MOCK[asset]); setIsLive(false); }
      else setResult(null);
    }
  };

  const loadMock = (asset) => {
    setAssetInput(asset);
    setJobStatus(null);
    setResult(MOCK[asset] || null);
    setIsLive(false);
  };

  const doLogout = async () => {
    await logout().catch(()=>{});
    setAuthed(false);
    setResult(null);
  };

  const tickerItems = result?.tickerItems || (result ? [`${result.asset} · ${result.decision}`, `Date: ${result.date}`, `Job: ${result.jobId||'—'}`] : ['FINBOT', 'MULTI-AGENT ANALYSIS ENGINE', 'ENTER A TICKER TO BEGIN']);

  if (authCheck) {
    return <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',color:'#1e2d40',fontSize:'11px',letterSpacing:'0.1em'}}>INITIALISING…</div>;
  }

  if (!authed) {
    return (
      <>
        <style>{css}</style>
        <LoginScreen onLogin={() => setAuthed(true)} />
      </>
    );
  }

  const tickerDecision = result?.decision || 'HOLD';

  return (
    <div style={{background:'#080b10',color:'#c8d0e0',minHeight:'100vh',fontFamily:"'DM Mono',monospace"}}>
      <style>{css}</style>

      <TickerTape items={tickerItems} decision={tickerDecision}/>

      {/* Nav */}
      <div style={{background:'#0a0e14',borderBottom:'1px solid #111820',padding:'10px 24px',display:'flex',alignItems:'center',gap:'12px',flexWrap:'wrap'}}>
        <span style={{fontFamily:"'Syne',sans-serif",fontSize:'16px',fontWeight:'800',color:'#fff',letterSpacing:'0.05em',marginRight:'4px'}}>FINBOT</span>
        <input className="nav-input" value={assetInput} onChange={e=>setAssetInput(e.target.value.toUpperCase())} onKeyDown={e=>e.key==='Enter'&&runAnalysis()} placeholder="Ticker…"/>
        <input
          type="date"
          value={dateInput}
          onChange={e=>setDateInput(e.target.value)}
          style={{background:'#111820',border:'1px solid #1a2535',borderRadius:'4px',padding:'6px 10px',color:'#8090a0',fontFamily:"'DM Mono',monospace",fontSize:'11px',outline:'none',colorScheme:'dark'}}
        />
        <button className="nav-btn" onClick={runAnalysis} disabled={running}>{running?'Running…':'Run Analysis'}</button>
        <div style={{display:'flex',gap:'6px'}}>
          {Object.keys(MOCK).map(a=>(
            <button key={a} className={`nav-btn ${result?.asset===a?'pinned':''}`} onClick={()=>loadLatest(a)}>{a}</button>
          ))}
        </div>
        <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:'12px'}}>
          <span style={{fontSize:'10px',color:'#1e2d3d',letterSpacing:'0.06em'}}>
            {isLive ? '● LIVE DATA' : '○ DEMO MODE'}
          </span>
          <button className="nav-btn" onClick={doLogout} style={{fontSize:'10px'}}>Logout</button>
        </div>
      </div>

      {/* Content */}
      <div style={{maxWidth:'1280px',margin:'0 auto',padding:'28px 24px'}}>
        <JobStatusBar status={jobStatus} jobId={jobId} error={jobError}/>
        {result
          ? <ResultView d={result} isLive={isLive}/>
          : <EmptyState onLoad={loadMock}/>
        }
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
