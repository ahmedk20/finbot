name: Security                                                                                                                                                                            
   
on:                                                                                                                                                                                       
  push:                                                                                                                                                                                 
    branches: [main]
                                                                                                                                                                                            
jobs:
  secret-scan:                                                                                                                                                                            
    runs-on: ubuntu-latest                                                                                                                                                              
                                                                                                                                                                                            
    steps:
      - name: Checkout code                                                                                                                                                               
        uses: actions/checkout@v4                                                                                                                                                                       

      - name: Scan for secrets                                                                                                                                                            
        uses: gitleaks/gitleaks-action@v2
        env:                                                                                                                                                                              
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   

  dependency-audit:
    runs-on: ubuntu-latest                                                                                                                                                                
                                                                                                                                                                                          
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Audit finbot-api
        working-directory: ./finbot-api
        run: |
          # --audit-level=critical: remaining high-severity findings are in
          # @prisma/dev (Prisma Studio bundled UI) — not reachable at runtime.
          # Tracked: https://github.com/advisories/GHSA-wc8c-qw6v-h7f6
          npm audit --audit-level=critical

      - name: Audit news-scraper
        working-directory: ./news-scraper
        run: npm audit --audit-level=high

      - name: Audit Python deps
        working-directory: ./trading-agents
        run: |
          pip install pip-audit
          # --skip-editable: skip -e vendor/TradingAgents (local package, not third-party)
          # CVE-2026-4539: pygments transitive dep — no fix available yet, tracking upstream
          pip-audit -r requirements.txt --skip-editable --ignore-vuln CVE-2026-4539
  trivy-scan:                                                                                                                                                                             
    runs-on: ubuntu-latest                                                                                                                                                                
                                                                                                                                                                                            
    steps:                                                                                                                                                                              
      - name: Checkout code
        uses: actions/checkout@v4                                                                                                                                                                         
   
      - name: Scan finbot-api image                                                                                                                                                       
        uses: aquasecurity/trivy-action@master                                                                                                                                          
        with:                                                                                                                                                                             
          scan-type: fs                                                                                                                                                                 
          scan-ref: ./finbot-api                                                                                                                                                          
          severity: HIGH,CRITICAL                                                                                                                                                         
          exit-code: 1                                                                                                                                                                    

                                                                                                                                                                   